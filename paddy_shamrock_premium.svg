<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Rich Green Gradients for Depth -->
    <radialGradient id="leafGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#81C784; stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2E7D32; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20; stop-opacity:1" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Stem -->
  <path fill="#2E7D32" d="M512 512 L512 950 Q560 950 560 850 L560 512 Z" filter="url(#dropShadow)" />

  <!-- 3 Leaf Shamrock (Trefoil) -->
  <g filter="url(#dropShadow)">
    <!-- Top Leaf -->
    <path fill="url(#leafGradient)" d="M512 512 C400 450 350 300 350 200 C350 100 420 50 512 50 C604 50 674 100 674 200 C674 300 624 450 512 512 Z" />
    <!-- Right Leaf -->
    <path fill="url(#leafGradient)" d="M512 512 C574 400 724 350 824 350 C924 350 974 420 974 512 C974 604 924 674 824 674 C724 674 574 624 512 512 Z" />
    <!-- Left Leaf -->
    <path fill="url(#leafGradient)" d="M512 512 C450 624 300 674 200 674 C100 674 50 604 50 512 C50 420 100 350 200 350 C300 350 450 400 512 512 Z" />
  </g>
  
  <!-- Subtle Inner Highlights for 3D look -->
  <path d="M512 100 C480 100 450 130 450 180" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.3" />
</svg>
